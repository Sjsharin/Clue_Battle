<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Clue Battle</title>
    <script>
      const path = window.location.pathname;

      if (path.startsWith('/Clue_Battle')) {
        const redirect =
          '/Clue_Battle/?redirect=' +
          encodeURIComponent(
            path.replace('/Clue_Battle', '') +
            window.location.search +
            window.location.hash
          );

        window.location.replace(redirect);
      }
    </script>
  </head>

  <body>
    Redirecting...
  </body>
</html>
