<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clue Battle</title>

  <script>
    const path = window.location.pathname;

    const repo = "/Clue_Battle";

    if (path.startsWith(repo)) {
      const route = path.substring(repo.length);

      const redirect =
        repo +
        "/?route=" +
        encodeURIComponent(route) +
        "&" +
        window.location.search.substring(1);

      window.location.replace(redirect);
    }
  </script>
</head>

<body>
  Loading Clue Battle...
</body>
</html>
